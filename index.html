<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>应用商店数据预警看板 Demo</title>
  <style>
:root {
  --ink: #15223a;
  --muted: #718096;
  --line: #e7ebf2;
  --panel: #ffffff;
  --bg: #f4f7fb;
  --blue: #315cf6;
  --blue-soft: #edf1ff;
  --red: #e14b55;
  --red-soft: #fff0f1;
  --green: #24a36a;
  --green-soft: #eaf8f2;
  --yellow: #d99b21;
  --yellow-soft: #fff7e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
.topbar { height: 112px; padding: 24px max(28px, calc((100vw - 1440px)/2)); color: white; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(125deg, #17294f 0%, #264e9a 54%, #416ef4 100%); box-shadow: 0 12px 32px rgba(32, 69, 139, .18); }
.topbar h1 { margin: 3px 0 0; font-size: 27px; letter-spacing: .5px; }
.demo-note { margin: 6px 0 0; font-size: 11px; opacity: .72; letter-spacing: .2px; }
.eyebrow { margin: 0; font-size: 10px; letter-spacing: 2.6px; opacity: .64; }
.update { display: flex; align-items: center; gap: 9px; font-size: 13px; opacity: .86; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #52e09a; box-shadow: 0 0 0 5px rgba(82,224,154,.14); }
main { max-width: 1440px; padding: 26px 28px 48px; margin: auto; }
.business-tabs { display: flex; gap: 14px; margin-bottom: 18px; }
.business { min-width: 168px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; background: white; color: var(--ink); text-align: left; cursor: pointer; transition: .18s ease; }
.business span { display: block; font-size: 17px; font-weight: 700; }
.business small { display: block; margin-top: 3px; color: var(--muted); }
.business.active { color: white; border-color: var(--blue); background: var(--blue); box-shadow: 0 8px 20px rgba(49,92,246,.22); }
.business.active small { color: rgba(255,255,255,.7); }
.toolbar { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); background: white; border-radius: 12px; margin-bottom: 18px; }
.report-tabs { display: flex; gap: 4px; padding: 4px; border-radius: 9px; background: #f0f3f8; }
.report-tab { border: 0; padding: 8px 17px; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; }
.report-tab.active { background: white; color: var(--blue); font-weight: 700; box-shadow: 0 2px 8px rgba(28,45,82,.08); }
.period-picker { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
select, input[type=search] { border: 1px solid #dce2ec; border-radius: 8px; background: white; color: var(--ink); padding: 8px 10px; font: inherit; outline: none; }
select:focus, input[type=search]:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.alert-toggle { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
.refresh, .import { border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; font-weight: 700; }
.refresh { color: var(--blue); background: var(--blue-soft); }.import { color: white; background: var(--blue); }
.refresh:hover, .import:hover { filter: brightness(.97); transform: translateY(-1px); }.refresh:active, .import:active { transform: translateY(0); }.refresh:disabled { cursor: wait; opacity: .68; transform: none; }
.refresh.loading::before { content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 7px; vertical-align: -1px; border: 2px solid rgba(49,92,246,.25); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
.refresh-status { min-width: 92px; color: var(--green); font-size: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.warning { margin-bottom: 18px; padding: 12px 15px; border-radius: 10px; color: #8a5b00; background: var(--yellow-soft); border: 1px solid #f4ddb0; white-space: pre-line; }
.hidden { display: none !important; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 18px; }
.stats article { position: relative; overflow: hidden; min-height: 126px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: 0 5px 18px rgba(23,43,77,.045); }
.stats article::after { content: ""; position: absolute; width: 76px; height: 76px; border-radius: 50%; right: -20px; top: -23px; background: var(--blue-soft); }
.stats .danger::after { background: var(--red-soft); }.stats .success::after { background: var(--green-soft); }.stats .muted::after { background: var(--yellow-soft); }
.stats span, .stats small { display: block; color: var(--muted); font-size: 12px; }
.stats strong { display: block; margin: 7px 0 4px; font-size: 31px; line-height: 1; }
.stats .danger strong { color: var(--red); }.stats .success strong { color: var(--green); }.stats .muted strong { color: var(--yellow); }
.content-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, .8fr); gap: 18px; margin-bottom: 18px; }
.panel { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: 0 5px 18px rgba(23,43,77,.045); }
.panel-title { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px; }
.panel-title span { color: var(--blue); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
.panel-title h2 { margin: 3px 0 0; font-size: 17px; }
.chart { height: 260px; padding: 4px 20px 18px; }
.chart svg { width: 100%; height: 100%; overflow: visible; }
.axis-label { fill: #8792a5; font-size: 10px; }
.grid-line { stroke: #edf0f5; stroke-width: 1; }
.trend-line { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.trend-area { fill: url(#areaFill); }
.trend-dot { fill: white; stroke: var(--blue); stroke-width: 2.5; }
.donut { min-height: 190px; display: grid; place-items: center; }
.donut-ring { width: 148px; height: 148px; border-radius: 50%; position: relative; display: grid; place-items: center; }
.donut-ring::after { content: ""; position: absolute; inset: 21px; border-radius: 50%; background: white; }
.donut-center { z-index: 1; text-align: center; }.donut-center strong { display: block; font-size: 27px; }.donut-center small { color: var(--muted); }
.status-legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; padding: 0 18px 22px; font-size: 12px; color: var(--muted); }
.legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.table-panel { overflow: hidden; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { padding: 11px 14px; background: #f8fafc; color: var(--muted); font-weight: 600; text-align: right; white-space: nowrap; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
th:first-child, th:nth-child(2), td:first-child, td:nth-child(2) { text-align: left; }
td { padding: 12px 14px; text-align: right; border-bottom: 1px solid #eff2f6; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #fafbff; }
.metric-name { font-weight: 700; }.filter-name { color: var(--muted); max-width: 270px; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 99px; font-weight: 700; font-size: 11px; }
.status.alert { color: var(--red); background: var(--red-soft); }.status.normal { color: var(--green); background: var(--green-soft); }.status.missing { color: var(--yellow); background: var(--yellow-soft); }
.reason { max-width: 300px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.negative { color: var(--red); }.positive { color: var(--green); }
.empty { padding: 48px; text-align: center; color: var(--muted); }
.review-panel { margin-top: 18px; }.review-panel .panel-title small { color: var(--muted); }
.review-body { padding: 0 20px 20px; }.review-body textarea { width: 100%; min-height: 190px; resize: vertical; border: 1px solid #dce2ec; border-radius: 10px; padding: 15px; color: var(--ink); font: 14px/1.75 inherit; outline: none; }
.review-body textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.review-actions { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 10px; color: var(--green); font-size: 12px; }.review-actions button, .primary { border: 0; border-radius: 8px; padding: 9px 18px; color: white; background: var(--blue); cursor: pointer; font-weight: 700; }
@media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); }.content-grid { grid-template-columns: 1fr; }.toolbar { flex-wrap: wrap; }.alert-toggle { margin-left: 0; }.topbar { height: auto; gap: 16px; }.update { display: none; } }
@media (max-width: 560px) { main { padding: 18px 12px 36px; }.topbar { padding: 20px 16px; }.business { flex: 1; min-width: 0; }.stats { gap: 10px; }.stats article { min-height: 110px; padding: 15px; }.stats strong { font-size: 26px; } }

</style>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">DATA MONITOR · DEMO</p>
      <h1>应用商店数据预警看板</h1>
      <p class="demo-note">静态模拟数据 · 虚拟应用名称 · 演示阈值（非生产配置）</p>
    </div>
    <div class="update"><span class="live-dot"></span><span id="lastLoaded">正在读取数据…</span></div>
  </header>

  <main>
    <nav class="business-tabs" aria-label="业务选择">
      <button class="business active" data-business="store"><span>应用商店</span><small>PC 端业务演示</small></button>
    </nav>

    <section class="toolbar">
      <div class="report-tabs" id="reportTabs"></div>
      <label class="period-picker"><span id="periodLabel">数据日期</span><select id="periodSelect"></select></label>
      <label class="alert-toggle"><input id="onlyAlerts" type="checkbox" checked><span>只看预警</span></label>
      
      <button id="refreshButton" class="refresh">重新载入演示数据</button>
      <span id="refreshStatus" class="refresh-status" aria-live="polite"></span>
    </section>

    <section id="warning" class="warning hidden"></section>

    <section class="stats">
      <article><span>监测指标</span><strong id="totalCount">—</strong><small>当前周期全部指标</small></article>
      <article class="danger"><span>预警指标</span><strong id="alertCount">—</strong><small>达到预警阈值</small></article>
      <article class="success"><span>正常指标</span><strong id="normalCount">—</strong><small>未达到预警阈值</small></article>
      <article class="muted"><span>数据缺失</span><strong id="missingCount">—</strong><small>无法完成判断</small></article>
    </section>

    <section class="content-grid">
      <article class="panel trend-panel">
        <div class="panel-title">
          <div><span>趋势</span><h2 id="trendTitle">预警数量变化</h2></div>
          <select id="metricSelect"><option value="__alerts__">预警数量</option></select>
        </div>
        <div id="chart" class="chart"></div>
      </article>

      <article class="panel status-panel">
        <div class="panel-title"><div><span>概览</span><h2>本期状态</h2></div></div>
        <div id="donut" class="donut"></div>
        <div id="statusLegend" class="status-legend"></div>
      </article>
    </section>

    <section class="panel table-panel">
      <div class="panel-title">
        <div><span>明细</span><h2 id="tableTitle">指标监测结果</h2></div>
        <input id="searchInput" type="search" placeholder="搜索指标或筛选对象">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="empty" class="empty hidden">当前条件下没有数据</div>
      </div>
    </section>

    <section class="panel review-panel">
      <div class="panel-title">
        <div><span>REVIEW</span><h2 id="reviewTitle">预警复盘</h2></div>
        <small id="reviewUpdated"></small>
      </div>
      <div class="review-body">
        <textarea id="reviewText" placeholder="在这里自由填写本期预警复盘、原因、结论或后续行动……"></textarea>
        <div class="review-actions"><span id="reviewMessage"></span><button id="saveReview">保存复盘</button></div>
      </div>
    </section>
  </main>

":"演示数据","source_file":"应用商店_模拟月报.xlsx"},{"business":"store","business_name":"应用商店","report_type":"monthly","period":"2026-09","product":"PC端应用商店","metric":"新用户","filter":"月度汇总","current":160000,"previous":150000,"week_ago":null,"difference":10000,"difference_threshold":25000,"change_rate":0.06666666666666667,"change_threshold":0.15,"week_rate":null,"week_threshold":null,"status":"否","reason":"","source_path":"应用商店月报 / 用户概况","run_time":"演示数据","source_file":"应用商店_模拟月报.xlsx"},{"business":"store","business_name":"应用商店","report_type":"monthly","period":"2026-09","product":"PC端应用商店","metric":"活跃用户","filter":"月度汇总","current":5500000,"previous":5200000,"week_ago":null,"difference":300000,"difference_threshold":500000,"change_rate":0.057692307692307696,"change_threshold":0.12,"week_rate":null,"week_threshold":null,"status":"否","reason":"","source_path":"应用商店月报 / 用户概况","run_time":"演示数据","source_file":"应用商店_模拟月报.xlsx"},{"business":"store","business_name":"应用商店","report_type":"monthly","period":"2026-10","product":"PC端应用商店","metric":"新用户","filter":"月度汇总","current":190000,"previous":160000,"week_ago":null,"difference":30000,"difference_threshold":25000,"change_rate":0.1875,"change_threshold":0.15,"week_rate":null,"week_threshold":null,"status":"是","reason":"月差值达到演示阈值；环比达到演示阈值","source_path":"应用商店月报 / 用户概况","run_time":"演示数据","source_file":"应用商店_模拟月报.xlsx"},{"business":"store","business_name":"应用商店","report_type":"monthly","period":"2026-10","product":"PC端应用商店","metric":"活跃用户","filter":"月度汇总","current":5000000,"previous":5500000,"week_ago":null,"difference":-500000,"difference_threshold":500000,"change_rate":-0.09090909090909091,"change_threshold":0.12,"week_rate":null,"week_threshold":null,"status":"是","reason":"月差值达到演示阈值","source_path":"应用商店月报 / 用户概况","run_time":"演示数据","source_file":"应用商店_模拟月报.xlsx"}],"periods":{"store":{"daily":["2026-10-29","2026-10-28","2026-10-27","2026-10-26","2026-10-25","2026-10-24","2026-10-23","2026-10-22","2026-10-21","2026-10-20"],"monthly":["2026-10","2026-09","2026-08"]},"ott":{"daily":[],"monthly":[]}},"errors":[],"last_loaded":"静态演示数据","refresh_seconds":null,"file_summary":{"内置模拟数据":2}};

</script>
  <script>
const state = { data: null, business: "store", reportType: "daily", period: "", onlyAlerts: true, search: "", metric: "__alerts__", reviewKey: "" };

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
const num = value => value == null || value === "" ? "—" : Number(value).toLocaleString("zh-CN", { maximumFractionDigits: 2 });
const pct = value => value == null || value === "" ? "—" : `${(Number(value) * 100).toFixed(2)}%`;
const statusClass = value => value === "是" ? "alert" : value === "否" ? "normal" : "missing";
const statusText = value => value === "是" ? "预警" : value === "否" ? "正常" : "数据缺失";
const changeClass = value => Number(value) < 0 ? "negative" : Number(value) > 0 ? "positive" : "";

async function loadData() {
  const button = $("refreshButton");
  const originalText = button.textContent;
  button.disabled = true;
  button.classList.add("loading");
  button.textContent = "刷新中";
  $("refreshStatus").textContent = "";
  try {
    // 离线作品集模式：数据已内置在本页面中。
    if (window.DEMO_DATA) {
      state.data = JSON.parse(JSON.stringify(window.DEMO_DATA));
      $("lastLoaded").textContent = "演示数据 · 本地静态版（非实时业务数据）";
    }
    renderNavigation();
    renderAll();
    const warning = $("warning");
    if (state.data.errors.length) {
      warning.textContent = state.data.errors.join("\n");
      warning.classList.remove("hidden");
    } else warning.classList.add("hidden");
    $("refreshStatus").textContent = `刷新成功 ${new Date().toLocaleTimeString("zh-CN", {hour12:false})}`;
  } catch (error) {
    $("warning").textContent = error.message;
    $("warning").classList.remove("hidden");
    $("refreshStatus").textContent = "刷新失败";
  } finally {
    button.disabled = false;
    button.classList.remove("loading");
    button.textContent = originalText || "刷新数据";
  }
}

function renderNavigation() {
  document.querySelectorAll(".business").forEach(button => button.classList.toggle("active", button.dataset.business === state.business));
  const types = state.business === "store" ? [["daily","日报"],["monthly","月报"]] : [["daily","日报"]];
  if (!types.some(([value]) => value === state.reportType)) state.reportType = "daily";
  $("reportTabs").innerHTML = types.map(([value,label]) => `<button class="report-tab ${value === state.reportType ? "active" : ""}" data-type="${value}">${label}</button>`).join("");
  document.querySelectorAll(".report-tab").forEach(button => button.onclick = () => { state.reportType = button.dataset.type; state.period = ""; state.metric = "__alerts__"; renderNavigation(); renderAll(); });
  $("periodLabel").textContent = state.reportType === "monthly" ? "数据月份" : "数据日期";
  const periods = state.data.periods[state.business][state.reportType] || [];
  if (!periods.includes(state.period)) state.period = periods[0] || "";
  $("periodSelect").innerHTML = periods.length ? periods.map(period => `<option ${period === state.period ? "selected" : ""}>${esc(period)}</option>`).join("") : `<option>暂无数据</option>`;
}

function currentRows() {
  return state.data.rows.filter(row => row.business === state.business && row.report_type === state.reportType && row.period === state.period);
}

function renderAll() {
  if (!state.data) return;
  const rows = currentRows();
  const counts = { alert: rows.filter(r => r.status === "是").length, normal: rows.filter(r => r.status === "否").length, missing: rows.filter(r => !["是","否"].includes(r.status)).length };
  $("totalCount").textContent = rows.length;
  $("alertCount").textContent = counts.alert;
  $("normalCount").textContent = counts.normal;
  $("missingCount").textContent = counts.missing;
  renderMetricOptions();
  renderTrend();
  renderDonut(counts, rows.length);
  renderTable(rows);
  loadReview();
}

async function loadReview() {
  const key = `${state.business}|${state.reportType}|${state.period}`;
  state.reviewKey = key;
  $("reviewTitle").textContent = `预警复盘 · ${state.period || "暂无周期"}`;
  $("reviewMessage").textContent = "";
  if (!state.period) { $("reviewText").value = ""; return; }
  try {
    let data;
    if (window.DEMO_DATA) {
      data = JSON.parse(localStorage.getItem(`store-demo-review:${key}`) || "null") || {content:"",updated_at:""};
    }
    if (state.reviewKey !== key) return;
    $("reviewText").value = data.content || "";
    $("reviewUpdated").textContent = data.updated_at ? `最后保存：${data.updated_at}` : "尚未填写";
  } catch { $("reviewMessage").textContent = "复盘读取失败"; }
}

async function saveReview() {
  if (!state.period) return;
  $("saveReview").disabled = true;
  try {
    let data;
    if (window.DEMO_DATA) {
      data = {content:$("reviewText").value, updated_at:new Date().toLocaleString("zh-CN", {hour12:false})};
      localStorage.setItem(`store-demo-review:${state.reviewKey}`, JSON.stringify(data));
    }
    $("reviewUpdated").textContent = `最后保存：${data.updated_at}`;
    $("reviewMessage").textContent = "已保存";
  } catch (error) { $("reviewMessage").textContent = error.message; }
  finally { $("saveReview").disabled = false; }
}

function renderMetricOptions() {
  const rows = state.data.rows.filter(r => r.business === state.business && r.report_type === state.reportType);
  const metrics = [...new Set(rows.map(r => `${r.metric}|||${r.filter}`))].sort();
  if (state.metric !== "__alerts__" && !metrics.includes(state.metric)) state.metric = "__alerts__";
  $("metricSelect").innerHTML = `<option value="__alerts__">预警数量</option>` + metrics.map(key => { const [metric, filter] = key.split("|||"); return `<option value="${esc(key)}" ${key === state.metric ? "selected" : ""}>${esc(metric)} · ${esc(filter)}</option>`; }).join("");
}

function renderTrend() {
  const all = state.data.rows.filter(r => r.business === state.business && r.report_type === state.reportType);
  const periods = [...new Set(all.map(r => r.period))].sort();
  let points;
  if (state.metric === "__alerts__") {
    $("trendTitle").textContent = "预警数量变化";
    points = periods.map(period => ({ label: period, value: all.filter(r => r.period === period && r.status === "是").length }));
  } else {
    const [metric, filter] = state.metric.split("|||");
    $("trendTitle").textContent = `${metric} · ${filter}`;
    points = periods.map(period => { const row = all.find(r => r.period === period && r.metric === metric && r.filter === filter); return { label: period, value: row?.current ?? null }; }).filter(p => p.value != null);
  }
  drawLineChart(points);
}

function drawLineChart(points) {
  const chart = $("chart");
  if (!points.length) { chart.innerHTML = `<div class="empty">暂无趋势数据</div>`; return; }
  const W = 760, H = 220, left = 48, right = 15, top = 18, bottom = 37;
  const values = points.map(p => Number(p.value));
  let min = Math.min(...values), max = Math.max(...values);
  if (min === max) { min = Math.min(0, min); max = max === 0 ? 1 : max * 1.15; }
  const pad = (max - min) * .12; min = Math.max(0, min - pad); max += pad;
  const x = i => left + (points.length === 1 ? (W-left-right)/2 : i*(W-left-right)/(points.length-1));
  const y = v => top + (max-v)*(H-top-bottom)/(max-min || 1);
  const line = points.map((p,i) => `${i ? "L" : "M"}${x(i)},${y(Number(p.value))}`).join(" ");
  const area = `${line} L${x(points.length-1)},${H-bottom} L${x(0)},${H-bottom} Z`;
  const grid = [0,.25,.5,.75,1].map(t => { const yy=top+t*(H-top-bottom), val=max-t*(max-min); return `<line class="grid-line" x1="${left}" y1="${yy}" x2="${W-right}" y2="${yy}"/><text class="axis-label" x="${left-8}" y="${yy+3}" text-anchor="end">${formatAxis(val)}</text>`; }).join("");
  const labels = points.map((p,i) => `<text class="axis-label" x="${x(i)}" y="${H-12}" text-anchor="middle">${esc(p.label.slice(state.reportType === "monthly" ? 2 : 5))}</text>`).join("");
  const dots = points.map((p,i) => `<circle class="trend-dot" cx="${x(i)}" cy="${y(Number(p.value))}" r="4"><title>${esc(p.label)}：${num(p.value)}</title></circle>`).join("");
  chart.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#315cf6" stop-opacity=".24"/><stop offset="100%" stop-color="#315cf6" stop-opacity=".015"/></linearGradient></defs>${grid}<path class="trend-area" d="${area}"/><path class="trend-line" d="${line}"/>${dots}${labels}</svg>`;
}

function formatAxis(value) { if (Math.abs(value) >= 1e6) return `${(value/1e6).toFixed(1)}m`; if (Math.abs(value) >= 1e3) return `${(value/1e3).toFixed(1)}k`; return Number(value.toFixed(1)); }

function renderDonut(counts, total) {
  const alertDeg = total ? counts.alert / total * 360 : 0;
  const normalDeg = total ? (counts.alert + counts.normal) / total * 360 : alertDeg;
  $("donut").innerHTML = `<div class="donut-ring" style="background:conic-gradient(var(--red) 0 ${alertDeg}deg,var(--green) ${alertDeg}deg ${normalDeg}deg,var(--yellow) ${normalDeg}deg 360deg)"><div class="donut-center"><strong>${total}</strong><small>全部指标</small></div></div>`;
  $("statusLegend").innerHTML = `<span><i class="legend-dot" style="background:var(--red)"></i>预警 ${counts.alert}</span><span><i class="legend-dot" style="background:var(--green)"></i>正常 ${counts.normal}</span><span><i class="legend-dot" style="background:var(--yellow)"></i>缺失 ${counts.missing}</span>`;
}

function renderTable(rows) {
  const monthly = state.reportType === "monthly";
  const headers = monthly ? ["指标","筛选对象","当月值","前月值","月差值","环比","状态","触发原因"] : ["指标","筛选对象","当日值","前日值","日差值","环比","周同比","状态","触发原因"];
  $("tableHead").innerHTML = headers.map(h => `<th>${h}</th>`).join("");
  const query = state.search.trim().toLowerCase();
  const filtered = rows.filter(row => (!state.onlyAlerts || row.status === "是") && (!query || `${row.metric} ${row.filter}`.toLowerCase().includes(query)));
  $("tableTitle").textContent = `指标监测结果 · ${filtered.length}项`;
  $("empty").classList.toggle("hidden", filtered.length > 0);
  $("tableBody").innerHTML = filtered.map(row => {
    const common = `<td class="metric-name">${esc(row.metric)}</td><td class="filter-name" title="${esc(row.filter)}">${esc(row.filter)}</td><td>${num(row.current)}</td><td>${num(row.previous)}</td><td class="${changeClass(row.difference)}">${num(row.difference)}</td><td class="${changeClass(row.change_rate)}">${pct(row.change_rate)}</td>`;
    const week = monthly ? "" : `<td class="${changeClass(row.week_rate)}">${pct(row.week_rate)}</td>`;
    return `<tr>${common}${week}<td><span class="status ${statusClass(row.status)}"><i>●</i>${statusText(row.status)}</span></td><td class="reason" title="${esc(row.reason)}">${esc(row.reason || "—")}</td></tr>`;
  }).join("");
}

document.querySelectorAll(".business").forEach(button => button.onclick = () => { state.business = button.dataset.business; state.reportType = "daily"; state.period = ""; state.metric = "__alerts__"; renderNavigation(); renderAll(); });
$("periodSelect").onchange = event => { state.period = event.target.value; renderAll(); };
$("onlyAlerts").onchange = event => { state.onlyAlerts = event.target.checked; renderAll(); };
$("searchInput").oninput = event => { state.search = event.target.value; renderTable(currentRows()); };
$("metricSelect").onchange = event => { state.metric = event.target.value; renderTrend(); };
$("refreshButton").onclick = loadData;
$("saveReview").onclick = saveReview;
loadData();

</script>
